services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: system-monitor-backend:latest
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
    pid: host
    volumes:
      # Lets the backend report the machine's hostname instead of the container ID
      - /etc/hostname:/host/etc/hostname:ro
    cap_add:
      - KILL
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_PORT=${BACKEND_PORT:-8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
    image: system-monitor-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - NEXT_PUBLIC_BACKEND_PORT=${BACKEND_PORT:-8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      - backend
    restart: unless-stopped
